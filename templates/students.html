
<!DOCTYPE html>
<html>
<head>
    <title>Registered Students | Student Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="logo">Student Portal</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/students">Students</a>
    </div>
</nav>

<div class="container">

    <div class="table-card">

        <h2>Registered Students</h2>
        <p class="subtitle">View all students and their registered courses.</p>

        <table>
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Email</th>
                <th>Course</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>
                    <span class="course-tag">{{ student[3] }}</span>
                </td>
            </tr>
            {% endfor %}
        </table>

    </div>

</div>

<footer>
    © 2026 Student Portal | Course Registration System
</footer>

</body>
</html>
